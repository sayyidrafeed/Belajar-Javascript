<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error Handling</title>
</head>
<body>
<script>

    class MathUtil {
        static sum(...numbers) {
            if (numbers.length === 0) {
                throw new Error("Total Parameter harus > 0!")
            }

            let result = 0;
            for (const number of numbers) {
                result += number;
            }

            return result;
        }
    }

    try {
        console.info(MathUtil.sum());
        console.info("Kode Block Try akan berhenti");
    } catch (error) {
        console.error(error.message);
    } finally {
        console.log("Closing DB...")
    }

    console.log("test")

</script>
</body>
</html>
