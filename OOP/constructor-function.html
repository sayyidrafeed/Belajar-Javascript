<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Constructor Function</title>
</head>
<body>
<script>
    function Person() {
        this.firstName = "";
        this.lastName = "";
    }

    const user1 = new Person("John", "Doe");

    console.log(`${user1.firstName} ${user1.lastName}`);
    console.log(user1);
</script>
</body>
</html>
