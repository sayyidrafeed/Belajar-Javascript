<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error Class (Bikin Sendiri class errornya)</title>
</head>
<body>
<script>
    class ValidationError extends Error {
        constructor(message, field) {
            super(message);
            this.field = field;
        }
    }

    class MathUtil {
        static sum(...numbers) {
            if (numbers.length === 0) {
                throw new Error("Total Parameter harus > 0!")
            }

            let result = 0;
            for (const number of numbers) {
                result += number;
            }

            return result;
        }
    }

    try {
        console.log(MathUtil.sum());
    } catch(error) {
        if (error instanceof ValidationError) {
            console.error(error.message, error.field);
        } else {
            console.error(`Terjadi error : ${error.message}`);
        }
    }
</script>
</body>
</html>
