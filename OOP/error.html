<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class: Error</title>
</head>
<body>
<script>

    class MathUtil {
        static sum(...numbers) {
            if (numbers.length === 0) {
                throw new Error("Total Parameter harus > 0!")
            }

            let result = 0;
            for (const number of numbers) {
                result += number;
            }

            return result;
        }
    }

    console.info(MathUtil.sum(1, 2, 3));
    console.info("Halo");
    console.info(MathUtil.sum());


</script>
</body>
</html>
