<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CLass</title>
</head>
<body>
<script>
    class User {
        constructor(name, email, password) {
            this.name = String(name);
            this.email = String(email);
            this.password = password;
        }
    }

    class ForeignUser extends User {
         constructor(name, email, password, region) {
             super(name, email, password);
             this.region = region;
         }
    }
    const rafee = new User("rafee", "rafee@mail.com", "password");
    console.log(rafee);
    const budi = new ForeignUser("budi", "budi@mail.com", "password", "Canada");
    console.log(budi);
</script>
</body>
</html>
