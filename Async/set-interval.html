<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Interval</title>
</head>
<body>
<h1 id="header"></h1>
<script>


    function setHeaderText(text) {
        const header = document.getElementById("header");
        header.textContent = new Date().toString();
    }

    function sayHello() {
        console.log("Hello, RFD!");
    }

    setInterval(sayHello, 1000);
    setInterval(setHeaderText, 1000);
</script>
</body>
</html>
