<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math</title>
</head>
<body>
<script>
    {
        const num = 10;
        console.log(Math.abs(num)); // 10
        console.log(Math.abs(-num)); // 10
    }

    {
        const num = 2.5;
        console.log(Math.ceil(num)); // 3
        console.log(Math.floor(num)); // 2
    }

    {
        const num = 2.5;
        console.log(Math.round(num)); // 3
        console.log(Math.trunc(num)); // 2
    }

    {
        const num = 2.5;
        console.log(Math.pow(num, 2)); // 6.25
        console.log(Math.sqrt(16)); // 4
    }

    {
        const num = Math.PI;
        console.log(Math.sin(num)); // ~0.14
        console.log(Math.cos(num)); // ~-0.99
    }
</script>
</body>
</html>
