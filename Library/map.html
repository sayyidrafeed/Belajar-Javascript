<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
</head>
<body>
<script>
    const map = new Map();
    map.set('name', 'John');
    map.set('age', 30);
    map.set('city', 'New York');
    console.log(map.get('name')); // John
    console.log(map.has('age')); // true
    console.log(map.size); // 3
    map.delete('name');
    console.log(map);
    map.set('aduh', 'adauh');

    const person = {};

    person.name = 'John';
    console.log(person);

    for (const elemen of map) {
        console.log(elemen); // [ 'age', 30 ] [ 'city', 'New York' ]
    }
</script>
</body>
</html>
