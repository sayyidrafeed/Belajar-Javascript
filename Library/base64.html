<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>base64</title>
</head>
<body>
<script>

     let str = "Aku suka kamu";
     console.log(str);
     let encoded = btoa(str);
     console.log(encoded);
     let decoded = atob(encoded);
     console.log(decoded);

</script>
</body>
</html>
