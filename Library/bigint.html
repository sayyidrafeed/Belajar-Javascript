<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BigInt</title>
</head>
<body>

<script>
    console.log(Number.MAX_SAFE_INTEGER);

    const a = BigInt(Number.MAX_SAFE_INTEGER);
    const b = BigInt(Number.MIN_SAFE_INTEGER);

    const c = a + b;
    console.log(Number(c));
</script>

</body>
</html>
