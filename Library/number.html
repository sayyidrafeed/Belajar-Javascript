<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number</title>
</head>
<body>
<script>
    let nomor = 12;

    console.log(typeof nomor);
    console.log(Number(nomor));

    console.log(Number.NaN);
    console.log(Number.MIN_VALUE);
    console.log(Number.MAX_VALUE);
    console.log(Number.POSITIVE_INFINITY);
    console.log(Number.isFinite(nomor));

    console.log(nomor.toLocaleString("id-ID"))
</script>
</body>
</html>
