<!DOCTYPE html>

<body>
<script>
    let age = Number(prompt("Masukkan Umurmu"));

    if (age <= 12) {
        console.log(`${age} adalah Anak-anak.`)
    } else if (age <= 21) {
        console.log(`${age} adalah Remaja.`)
    } else if (age <= 60) {
        console.log(`${age} adalah Dewasa`)
    } else if (age > 60) {
        console.log(`${age} adalah Lanjut Usia.`)
    } else {
        console.log(`${age} Bukan angka yang valid.`)
    }

    let user = {
        profile: {
            name: "John"
        }
    };

    console.log(`Nama: ${user?.profile?.name ?? "Tidak ada nama"}`);
    console.log(`Alamat: ${user?.profile?.address ?? "Tidak ada alamat"}`);

    console.log("1 - 10");
    for (let i = 1; i <= 10; i++) {

    }

    const fruits = ["Apple", "Orange", "Mango", "Strawberry"];

        console.log(i);
    }

    const person = {
        name: "John",
        age: 5,

    for (const i in person) {

            break;

</script>
