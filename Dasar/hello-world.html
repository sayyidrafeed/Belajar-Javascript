<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
</head>
<body>
<script>
    // First journey on JavaScript!
    document.writeln("<h1>Hello, World!</h1>");

    // Boolean Data
    document.write(true);
    document.write("</br>");

    // Concatenation
    document.writeln("Nama : " + "Rafee");
    document.writeln("</br>");
    document.writeln("Umur : " + 18 + " Tahun");

    // Variable
    var ganteng = "Rafee";

    document.write("</br>" + ganteng);

    let siapa = ganteng;

    document.write("</br>" + siapa);
</script>
</body>
</html>
