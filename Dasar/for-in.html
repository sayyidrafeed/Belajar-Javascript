<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For in</title>
</head>
<body>
<script>
    const person = {
        firstName: 'John',
        lastName: 'Doe',
        age: 4
    }

    for (const property in person) {
        console.log(`${property}: ${person[property]}`);
    }
</script>
</body>
</html>
