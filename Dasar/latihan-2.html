<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice #2</title>
</head>
<body>
<script>
    function plus(a, b) {
        console.log(a + b);
    }

    function minus(a, b) {
        console.log(a - b);
    }

    function multiply(a, b) {
        console.log(a * b);
    }

    function divide(a, b) {
        console.log(a / b);
    }

    function modulus(a, b) {
        console.log(a % b);
    }

    function exponential(a, b) {
        console.log(a ** b);
    }

    exponential(2, 3);
    modulus(100, 3);
    divide(100, 3);
    multiply(1213, 3);
    minus(5, 3);
    plus(5, 3);

</script>
</body>
</html>
