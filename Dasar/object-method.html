<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Object Method</title>
</head>
<body>
<script>
    const person = {
        name: "John",
        hello: function (name) {
            console.log(`Hello ${name}`);
        }
    }

    person.hello(person);
</script>
</body>
</html>
