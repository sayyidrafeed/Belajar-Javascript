<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Statement</title>
</head>
<body>
<script>
  const nilai = prompt("Berapa nilai anda?");

  switch(nilai) {
    case "A":
      alert("Wow! keren.");
      break;
    case "B":
      alert("Anda lulus.");
      break;
    case "C":
      alert("Anda gagal");
      break;
    default:
      alert(`${nilai} itu nilai apa?`);
  }
</script>
</body>
</html>
