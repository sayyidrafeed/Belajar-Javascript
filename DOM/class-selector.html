<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Selector</title>
</head>
<body>
<div class="container">
    <p class="desc">Aduh</p>
</div>

<script>
    const container = document.querySelector('.container');
    const desc = document.querySelector('.desc');

    console.log(container);
    console.log(desc);
</script>
</body>
</html>
