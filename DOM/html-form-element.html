<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Form Element</title>
</head>
<body>
<form id="commentForm">
    <label for="comment">
        <input type="text" name="comment" id="comment" placeholder="Enter your comment">
    </label>
    <label for="from">
        <input type="text" name="from" id="from" placeholder="Enter your name">
    </label>
    <input type="submit" value="Submit here!">
</form>

<div id="commentList">

</div>
<script>
    document.querySelector('form[name="commentForm"]').onsubmit = function(event){
        const commentList = document.getElementById('commentList');
        const comment = document.getElementById('comment').value;
        const from = document.getElementById('from').value;

        const commentItem = document.createElement("p");
        commentItem.textContent = `${comment} - ${from}`;
        commentList.appendChild(commentItem);

        document.forms['commentForm'].reset();

        event.preventDefault();
    }


</script>
</body>
</html>
