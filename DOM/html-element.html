<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Element</title>
</head>
<body>
<a href="" id="link"></a>

<script>
    const link = document.getElementById('link');
    link.href = 'https://www.google.com/search?q=deade';
    link.target = '_blank';
    link.textContent = 'Google Search';
</script>
</body>
</html>
